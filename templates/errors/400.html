{% extends "base.html" %}

{% block title %}400 Bad Request | Bounty Board{% endblock %}

{% block content %}
<div class="error-page-container">
  <div class="error-card">
    <div class="error-code">400</div>
    <h1 class="page-title">BAD REQUEST</h1>
    <p style="font-size: var(--text-lg); margin-bottom: var(--spacing-6);">
      Your browser sent something that doesn't make sense to us. Check the URL or payload.
    </p>
    <a href="/" class="btn btn-primary">BACK TO THE BOARD</a>
  </div>
</div>
{% endblock %}
