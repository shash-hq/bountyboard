{% extends "base.html" %}

{% block title %}404 Not Found | Bounty Board{% endblock %}

{% block content %}
<div class="error-page-container">
  <div class="error-card">
    <div class="error-code">404</div>
    <h1 class="page-title">BOUNTY MISSING</h1>
    <p style="font-size: var(--text-lg); margin-bottom: var(--spacing-6);">
      Either this bounty never existed, was deleted by its poster, or got hidden by campus moderators.
    </p>
    <a href="/" class="btn btn-primary">RETURN TO ACTIVE BOUNTIES</a>
  </div>
</div>
{% endblock %}
