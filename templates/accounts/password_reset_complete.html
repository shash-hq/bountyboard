{% extends "base.html" %}

{% block title %}Password Updated | Bounty Board{% endblock %}

{% block content %}
<div class="form-center-container">
  <div class="brutal-card brutal-card--mint">
    <span class="stamp-badge stamp-done" style="margin-bottom: var(--spacing-3);">PASSWORD CHANGED</span>
    <h1 class="page-title">READY TO ROLL</h1>
    <p style="font-size: var(--text-base); line-height: 1.5; margin-bottom: var(--spacing-6);">
      Your password has been successfully reset. You can now log into your account with your new credentials.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary">LOGIN NOW &rarr;</a>
  </div>
</div>
{% endblock %}
