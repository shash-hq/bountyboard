name: Tick

# Free-tier Render has no cron and no workers, and it sleeps when idle. This calls /internal/tick
# every ~10 minutes: it wakes the service, closes overdue bounties, delivers queued email and keeps
# the free database from pausing. Needs two repository secrets: TICK_URL (the full
# https://<host>/internal/tick/ URL) and TICK_SECRET (same value as the service's TICK_SECRET).
# Scheduled workflows run free on public repositories; GitHub may delay them by several minutes.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: tick
  cancel-in-progress: false

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /internal/tick
        env:
          TICK_URL: ${{ secrets.TICK_URL }}
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
        run: |
          if [ -z "$TICK_URL" ] || [ -z "$TICK_SECRET" ]; then
            echo "TICK_URL / TICK_SECRET are not set; nothing to do."
            exit 0
          fi
          # A cold start of the free instance can take ~60 s, so retry and allow a long first response.
          curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 15 --retry-all-errors --max-time 90 \
            -X POST -H "X-Tick-Secret: ${TICK_SECRET}" "${TICK_URL}"
