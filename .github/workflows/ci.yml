name: CI

on:
  push:
    branches: [ main, 'phase-*' ]
  pull_request:
    branches: [ main, 'phase-*' ]

jobs:
  test:
    runs-on: ubuntu-latest
    # Tests target PostgreSQL, not SQLite: SQLite serializes writers and
    # makes select_for_update a no-op, which hides the real races.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bountyboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bountyboard
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Django System Check
      run: |
        python manage.py check --settings=config.settings.dev

    - name: Production settings boot and deploy check
      env:
        SECRET_KEY: ci-only-not-a-real-secret-0123456789-abcdefghijklmnopqrstuvwxyz
        ALLOWED_HOSTS: bountyboard.example.com
        CSRF_TRUSTED_ORIGINS: https://bountyboard.example.com
        SITE_URL: https://bountyboard.example.com
        # Throwaway CI-only values; prod.py refuses to boot without keys of this shape.
        REG_NO_HMAC_KEY: ci-only-reg-no-hmac-key-0123456789-abcdefghijklmnop
        CARD_NAME_KEYS: Zm9vYmFyLWNhcmQtbmFtZS1rZXktMzItYnl0ZXMhISE=
      run: |
        python manage.py check --deploy --fail-level WARNING --settings=config.settings.prod

    - name: Check Missing Migrations
      run: |
        python manage.py makemigrations --check --dry-run --settings=config.settings.dev

    - name: Run Test Suite & Coverage
      run: |
        coverage run --branch manage.py test --settings=config.settings.dev
        coverage report --fail-under=87 --omit="*/tests*.py,*/migrations/*,manage.py,config/*"
